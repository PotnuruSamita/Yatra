<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Q&A Chatbot</title>
</head>
<body>
  <h1>Gemini Q&A Chatbot</h1>

  <div id="chatContainer" style="border:1px solid #ccc;height:500px;overflow-y:scroll;padding:20px;margin:20px 0;width:700px;">
    <div style="background:#fff;padding:15px;margin:10px 0;border-left:4px solid #34a853;border-radius:10px;max-width:70%;">
      Bot: Hi! Ask me anything like “What is Python?” or “Explain machine learning”.
    </div>
  </div>

  <div style="width:700px;">
    <input type="text" id="messageInput" placeholder="Ask a question..." style="width:75%;padding:10px;font-size:16px;">
    <button id="sendButton" style="padding:10px 20px;font-size:16px;">Send</button>
  </div>

  <script>
    const GEMINI_API_KEY = "YOUR_REAL_KEY_HERE"; // put real key here

    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const question = messageInput.value.trim();
      if (!question) return;

      addUser(question);
      messageInput.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "Thinking...";

      try {
        const response = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + GEMINI_API_KEY,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: question }] }]
            })
          }
        );

        const data = await response.json();
        if (!response.ok) {
          console.log(data);
          addBot("Error: " + (data.error?.message || "Check API key or quota."));
        } else {
          const answer = data.candidates[0].content.parts[0].text;
          addBot(answer);
        }
      } catch (err) {
        console.error(err);
        addBot("Error: Network issue or blocked request.");
      }

      sendButton.disabled = false;
      sendButton.textContent = "Send";
      messageInput.focus();
    }

    function addUser(text) {
      const d = document.createElement("div");
      d.className = "user";
      d.style.background = "#4285f4";
      d.style.color = "#fff";
      d.style.padding = "15px";
      d.style.margin = "10px 0";
      d.style.borderRadius = "20px";
      d.style.maxWidth = "70%";
      d.style.marginLeft = "auto";
      d.textContent = text;
      chatContainer.appendChild(d);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addBot(text) {
      const d = document.createElement("div");
      d.className = "bot";
      d.style.background = "#fff";
      d.style.padding = "15px";
      d.style.margin = "10px 0";
      d.style.borderRadius = "20px";
      d.style.borderLeft = "4px solid #34a853";
      d.style.maxWidth = "70%";
      d.innerHTML = text.replace(/
/g, "<br>");
      chatContainer.appendChild(d);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
